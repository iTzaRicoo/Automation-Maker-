name: Eufy C30 MQTT Bridge
version: "0.1.0"
slug: eufy_c30_mqtt
init: false
description: Publish Eufy C30 doorbell events and snapshots from eufy-security-ws to MQTT/Home Assistant.
url: https://github.com/YOUR_USERNAME/eufy-c30-mqtt-addon
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
map:
  - share:rw
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_base_topic: eufy/c30
  mqtt_discovery_prefix: homeassistant
  eufy_ws_url: ws://192.168.1.50:3000
  device_serial: ""
  device_name: Eufy C30 Doorbell
  snapshot_enabled: true
  snapshot_http_url: ""
  snapshot_interval_seconds: 0
  raw_events: true
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_base_topic: str
  mqtt_discovery_prefix: str
  eufy_ws_url: str
  device_serial: str?
  device_name: str
  snapshot_enabled: bool
  snapshot_http_url: str?
  snapshot_interval_seconds: int(0,86400)
  raw_events: bool
