name: "Eufy C30 MQTT Bridge"
version: "0.1.4"
slug: "eufy_c30_mqtt"
description: "Publish Eufy C30 doorbell events and snapshots from eufy-security-ws to MQTT/Home Assistant."
url: "https://github.com/YOUR_USERNAME/eufy-c30-mqtt-addon"
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false

build_from:
  amd64: "ghcr.io/home-assistant/amd64-base:3.19"
  aarch64: "ghcr.io/home-assistant/aarch64-base:3.19"
  armv7: "ghcr.io/home-assistant/armv7-base:3.19"

options:
  mqtt_host: "homeassistant"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_topic_prefix: "eufy/c30"

  eufy_host: ""
  eufy_port: 3000

schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  mqtt_topic_prefix: str

  eufy_host: str
  eufy_port: int
